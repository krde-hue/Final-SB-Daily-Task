<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Monthly Rota Schedule Manager</title>

    <!-- Chart.js Library for Pie Chart Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #0b2240;
            --card-bg: #133054;
            --text-color: #ffffff;
            --header-text: #ffffff;
            --border-color: #ffffff;
            --table-header-bg: #0b2240;
            --accent-btn: #38bdf8;
            --accent-btn-text: #0b2240;
        }

        [data-theme="light"] {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --header-text: #0d233a;
            --border-color: #cbd5e0;
            --table-header-bg: #0d233a;
            --accent-btn: #0d233a;
            --accent-btn-text: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-back { background-color: var(--accent-btn); color: var(--accent-btn-text); }
        .btn-secondary { background-color: rgba(255, 255, 255, 0.2); color: var(--text-color); border: 1px solid var(--border-color); }

        .controls {
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 6px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        label { font-weight: bold; font-size: 14px; }
        select, input {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-weight: bold;
        }

        .main-layout {
            display: flex;
            gap: 25px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .table-container { overflow-x: auto; }

        table {
            border-collapse: collapse;
            width: auto;
            min-width: 650px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 5px;
            text-align: center;
            font-size: 13px;
        }

        th {
            background-color: var(--table-header-bg);
            color: #ffffff;
            font-weight: bold;
        }

        .day-col, .date-col { width: 75px; }

        .bulk-set-container {
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .bulk-select {
            font-size: 10px !important;
            padding: 2px !important;
            width: 100%;
        }

        .shift-select {
            width: 100%;
            padding: 5px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            background-color: #ffffff;
            color: #000000;
        }
        .shift-select:focus { outline: 2px solid #00bcff; }

        /* Exact Shift Color Coding */
        .shift-select[data-shift="7:00 - 16:00"] { background-color: #86efac !important; color: #064e3b !important; }
        .shift-select[data-shift="10:00 - 19:00"] { background-color: #fed7aa !important; color: #7c2d12 !important; }
        .shift-select[data-shift="12:00 - 21:00"] { background-color: #bae6fd !important; color: #0c4a6e !important; }
        .shift-select[data-shift="16:00 - 1:00"] { background-color: #fca5a5 !important; color: #7f1d1d !important; }
        .shift-select[data-shift="7:00 - 10:00 (WFH)"] { background-color: #fbcfe8 !important; color: #831843 !important; }
        .shift-select[data-shift="7:00 - 16:00 (WFH)"] { background-color: #f472b6 !important; color: #831843 !important; }
        .shift-select[data-shift="RD"] { background-color: #9ca3af !important; color: #111827 !important; }
        .shift-select[data-shift="VL"] { background-color: #fde047 !important; color: #713f12 !important; }
        .shift-select[data-shift="SL"] { background-color: #c084fc !important; color: #3b0764 !important; }

        .leave-section {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 480px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .leave-section-title {
            font-size: 15px;
            font-weight: bold;
            color: #ef4444;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chart-box {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            max-width: 300px;
            height: 280px;
        }

        .leave-table {
            width: 100%;
            min-width: 100%;
        }

        .badge-vl {
            background-color: #86efac;
            color: #064e3b;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .badge-sl {
            background-color: #ef4444;
            color: #ffffff;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .date-input-cell {
            width: 100%;
            padding: 4px;
            font-size: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            outline: none;
            border-radius: 3px;
        }
        .date-input-cell:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 4px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>

    <div class="header-top">
        <h2>Team Monthly Rota Schedule Manager</h2>
        <div>
            <button class="btn btn-secondary" onclick="toggleDarkMode()">🌓 Mode</button>
            <a href="index.html" class="btn btn-back">🔙 Back to Daily Duties</a>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn btn-secondary" onclick="changeMonth(-1)">◀ Prev Month</button>
        <div>
            <label for="month-select">Month: </label>
            <select id="month-select">
                <option value="0">January</option><option value="1">February</option>
                <option value="2">March</option><option value="3">April</option>
                <option value="4">May</option><option value="5">June</option>
                <option value="6">July</option><option value="7">August</option>
                <option value="8" selected>September</option><option value="9">October</option>
                <option value="10">November</option><option value="11">December</option>
            </select>
        </div>
        <div>
            <label for="year-input">Year: </label>
            <input type="number" id="year-input" value="2026" min="2020" max="2035" style="width: 80px;">
        </div>
        <button class="btn btn-secondary" onclick="changeMonth(1)">Next Month ▶</button>
        <div style="margin-left: auto; font-size: 12px; opacity: 0.9;">
            💾 Schedule & Leaves auto-save instantly!
        </div>
    </div>

    <div class="main-layout">
        <!-- Monthly Schedule Grid -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th colspan="2">Date</th>
                        <th style="color: #ffc0cb;">
                            Ann
                            <div class="bulk-set-container">
                                <select class="bulk-select" onchange="bulkSetShift(0, this.value)">
                                    <option value="">-- Set All Month --</option>
                                    <option value="CLEAR">-- Clear Month --</option>
                                    <option value="7:00 - 16:00">7:00 - 16:00</option>
                                    <option value="10:00 - 19:00">10:00 - 19:00</option>
                                    <option value="12:00 - 21:00">12:00 - 21:00</option>
                                    <option value="16:00 - 1:00">16:00 - 1:00</option>
                                    <option value="7:00 - 10:00 (WFH)">7:00 - 10:00 (WFH)</option>
                                    <option value="7:00 - 16:00 (WFH)">7:00 - 16:00 (WFH)</option>
                                    <option value="RD">RD</option>
                                </select>
                            </div>
                        </th>
                        <th style="color: #9cc2e5;">
                            Dave
                            <div class="bulk-set-container">
                                <select class="bulk-select" onchange="bulkSetShift(1, this.value)">
                                    <option value="">-- Set All Month --</option>
                                    <option value="CLEAR">-- Clear Month --</option>
                                    <option value="7:00 - 16:00">7:00 - 16:00</option>
                                    <option value="10:00 - 19:00">10:00 - 19:00</option>
                                    <option value="12:00 - 21:00">12:00 - 21:00</option>
                                    <option value="16:00 - 1:00">16:00 - 1:00</option>
                                    <option value="7:00 - 10:00 (WFH)">7:00 - 10:00 (WFH)</option>
                                    <option value="7:00 - 16:00 (WFH)">7:00 - 16:00 (WFH)</option>
                                    <option value="RD">RD</option>
                                </select>
                            </div>
                        </th>
                        <th style="color: #b4c6e7;">
                            Kenneth
                            <div class="bulk-set-container">
                                <select class="bulk-select" onchange="bulkSetShift(2, this.value)">
                                    <option value="">-- Set All Month --</option>
                                    <option value="CLEAR">-- Clear Month --</option>
                                    <option value="7:00 - 16:00">7:00 - 16:00</option>
                                    <option value="10:00 - 19:00">10:00 - 19:00</option>
                                    <option value="12:00 - 21:00">12:00 - 21:00</option>
                                    <option value="16:00 - 1:00">16:00 - 1:00</option>
                                    <option value="7:00 - 10:00 (WFH)">7:00 - 10:00 (WFH)</option>
                                    <option value="7:00 - 16:00 (WFH)">7:00 - 16:00 (WFH)</option>
                                    <option value="RD">RD</option>
                                </select>
                            </div>
                        </th>
                        <th style="color: #c6e0b4;">
                            Kriztel
                            <div class="bulk-set-container">
                                <select class="bulk-select" onchange="bulkSetShift(3, this.value)">
                                    <option value="">-- Set All Month --</option>
                                    <option value="CLEAR">-- Clear Month --</option>
                                    <option value="7:00 - 16:00">7:00 - 16:00</option>
                                    <option value="10:00 - 19:00">10:00 - 19:00</option>
                                    <option value="12:00 - 21:00">12:00 - 21:00</option>
                                    <option value="16:00 - 1:00">16:00 - 1:00</option>
                                    <option value="7:00 - 10:00 (WFH)">7:00 - 10:00 (WFH)</option>
                                    <option value="7:00 - 16:00 (WFH)">7:00 - 16:00 (WFH)</option>
                                    <option value="RD">RD</option>
                                </select>
                            </div>
                        </th>
                        <th style="color: #ffffff;">
                            Miguel
                            <div class="bulk-set-container">
                                <select class="bulk-select" onchange="bulkSetShift(4, this.value)">
                                    <option value="">-- Set All Month --</option>
                                    <option value="CLEAR">-- Clear Month --</option>
                                    <option value="7:00 - 16:00">7:00 - 16:00</option>
                                    <option value="10:00 - 19:00">10:00 - 19:00</option>
                                    <option value="12:00 - 21:00">12:00 - 21:00</option>
                                    <option value="16:00 - 1:00">16:00 - 1:00</option>
                                    <option value="7:00 - 10:00 (WFH)">7:00 - 10:00 (WFH)</option>
                                    <option value="7:00 - 16:00 (WFH)">7:00 - 16:00 (WFH)</option>
                                    <option value="RD">RD</option>
                                </select>
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody id="schedule-body"></tbody>
            </table>
        </div>

        <!-- Sidebar: Pie Chart & Leave Entry Table -->
        <div class="leave-section">
            <div>
                <div class="leave-section-title">📊 Team Monthly VL Breakdown</div>
                <div class="chart-box">
                    <div class="chart-wrapper">
                        <canvas id="vlPieChart"></canvas>
                    </div>
                </div>
            </div>

            <div>
                <div class="leave-section-title">🎋 Vacation & Sick Leave Dates</div>
                <table class="leave-table">
                    <thead>
                        <tr>
                            <th style="width: 50px;">Type</th>
                            <th>Ann</th>
                            <th>Dave</th>
                            <th>Kenneth</th>
                            <th>Kriztel</th>
                            <th>Miguel</th>
                        </tr>
                    </thead>
                    <tbody id="leave-dates-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const team = ["Ann", "Dave", "Kenneth", "Kriztel", "Miguel"];
        const shifts = [
            "", 
            "7:00 - 16:00", 
            "10:00 - 19:00", 
            "12:00 - 21:00", 
            "16:00 - 1:00", 
            "7:00 - 10:00 (WFH)", 
            "7:00 - 16:00 (WFH)", 
            "RD", 
            "VL",
            "SL"
        ];

        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        const monthSelect = document.getElementById('month-select');
        const yearInput = document.getElementById('year-input');
        const tbody = document.getElementById('schedule-body');
        const leaveDatesBody = document.getElementById('leave-dates-body');
        const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thurs", "Fri", "Sat"];

        let vlChartInstance = null;

        function getStorageKey() {
            return `schedule_${yearInput.value}_${monthSelect.value}`;
        }

        function getLeaveDatesStorageKey() {
            return `leave_dates_matrix_db`;
        }

        function updateCellColor(selectElement) {
            selectElement.setAttribute('data-shift', selectElement.value);
        }

        function toggleDarkMode() {
            const currentTheme = document.body.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('rota_theme', newTheme);
            renderVLPieChart();
        }

        function changeMonth(offset) {
            let currentMonth = parseInt(monthSelect.value);
            let currentYear = parseInt(yearInput.value);

            currentMonth += offset;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }

            monthSelect.value = currentMonth;
            yearInput.value = currentYear;
            renderCalendar();
        }

        function renderCalendar() {
            tbody.innerHTML = '';
            const selectedMonth = parseInt(monthSelect.value);
            const selectedYear = parseInt(yearInput.value);

            const totalDays = new Date(selectedYear, selectedMonth + 1, 0).getDate();
            const monthLabel = monthSelect.options[selectedMonth].text.substring(0, 3);

            let savedMonthData = {};
            try {
                savedMonthData = JSON.parse(localStorage.getItem(getStorageKey())) || {};
            } catch(e) { savedMonthData = {}; }

            for (let d = 1; d <= totalDays; d++) {
                const dateObj = new Date(selectedYear, selectedMonth, d);
                const dayName = weekdays[dateObj.getDay()];

                const tr = document.createElement('tr');

                const tdDay = document.createElement('td');
                tdDay.className = 'day-col';
                tdDay.textContent = dayName;
                tr.appendChild(tdDay);

                const tdDate = document.createElement('td');
                tdDate.className = 'date-col';
                tdDate.textContent = `${d}-${monthLabel}`;
                tr.appendChild(tdDate);

                team.forEach((member, memberIdx) => {
                    const tdShift = document.createElement('td');
                    const select = document.createElement('select');
                    select.className = 'shift-select';
                    
                    shifts.forEach(shiftText => {
                        const opt = document.createElement('option');
                        opt.value = shiftText;
                        opt.textContent = shiftText === "" ? "-- Select --" : shiftText;
                        select.appendChild(opt);
                    });

                    let activeShift = "";
                    if (savedMonthData[d] && savedMonthData[d][memberIdx] !== undefined) {
                        activeShift = savedMonthData[d][memberIdx];
                    }

                    select.value = activeShift;
                    updateCellColor(select);

                    select.addEventListener('change', () => {
                        updateCellColor(select);
                        let currentMonthData = {};
                        try {
                            currentMonthData = JSON.parse(localStorage.getItem(getStorageKey())) || {};
                        } catch(e) { currentMonthData = {}; }

                        if (!currentMonthData[d]) currentMonthData[d] = Array(team.length).fill("");
                        currentMonthData[d][memberIdx] = select.value;

                        localStorage.setItem(getStorageKey(), JSON.stringify(currentMonthData));
                        
                        syncLeavesFromSchedule();
                    });

                    tdShift.appendChild(select);
                    tr.appendChild(tdShift);
                });

                tbody.appendChild(tr);
            }

            syncLeavesFromSchedule();
        }

        function bulkSetShift(memberIdx, shiftValue) {
            if (!shiftValue) return;
            const selectedMonth = parseInt(monthSelect.value);
            const selectedYear = parseInt(yearInput.value);
            const totalDays = new Date(selectedYear, selectedMonth + 1, 0).getDate();

            let currentMonthData = {};
            try {
                currentMonthData = JSON.parse(localStorage.getItem(getStorageKey())) || {};
            } catch(e) { currentMonthData = {}; }

            let applyValue = (shiftValue === 'CLEAR') ? '' : shiftValue;

            for (let d = 1; d <= totalDays; d++) {
                if (!currentMonthData[d]) currentMonthData[d] = Array(team.length).fill("");
                currentMonthData[d][memberIdx] = applyValue;
            }

            localStorage.setItem(getStorageKey(), JSON.stringify(currentMonthData));
            renderCalendar();
        }

        function syncLeavesFromSchedule() {
            let leaveMatrix = {};
            team.forEach(m => leaveMatrix[m] = { vl: [], sl: [] });

            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key.startsWith("schedule_")) {
                    let parts = key.split('_');
                    let monthIdx = parseInt(parts[2]);
                    let monthLabel = monthSelect.options[monthIdx] ? monthSelect.options[monthIdx].text.substring(0, 3) : '';

                    try {
                        let monthData = JSON.parse(localStorage.getItem(key)) || {};
                        Object.keys(monthData).forEach(day => {
                            let row = monthData[day];
                            team.forEach((member, memberIdx) => {
                                let shiftVal = row[memberIdx];
                                if (shiftVal === 'VL') {
                                    leaveMatrix[member].vl.push(`${day}-${monthLabel}`);
                                } else if (shiftVal === 'SL') {
                                    leaveMatrix[member].sl.push(`${day}-${monthLabel}`);
                                }
                            });
                        });
                    } catch(e){}
                }
            }

            team.forEach(m => {
                while (leaveMatrix[m].vl.length < 10) leaveMatrix[m].vl.push('');
                while (leaveMatrix[m].sl.length < 5) leaveMatrix[m].sl.push('');
                leaveMatrix[m].vl = leaveMatrix[m].vl.slice(0, 10);
                leaveMatrix[m].sl = leaveMatrix[m].sl.slice(0, 5);
            });

            localStorage.setItem(getLeaveDatesStorageKey(), JSON.stringify(leaveMatrix));
            buildLeaveTables();
            renderVLPieChart();
        }

        function buildLeaveTables() {
            leaveDatesBody.innerHTML = '';
            
            let leaveMatrix = {};
            try {
                leaveMatrix = JSON.parse(localStorage.getItem(getLeaveDatesStorageKey())) || {};
            } catch(e) { leaveMatrix = {}; }

            for (let rowIdx = 0; rowIdx < 15; rowIdx++) {
                let tr = document.createElement('tr');
                let isVL = rowIdx < 10;
                let leaveType = isVL ? 'vl' : 'sl';
                let arrayIdx = isVL ? rowIdx : rowIdx - 10;

                let tdType = document.createElement('td');
                tdType.innerHTML = isVL ? '<span class="badge-vl">VL</span>' : '<span class="badge-sl">SL</span>';
                tr.appendChild(tdType);

                team.forEach((member) => {
                    let tdDate = document.createElement('td');
                    let input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'date-input-cell';

                    let val = (leaveMatrix[member] && leaveMatrix[member][leaveType] && leaveMatrix[member][leaveType][arrayIdx]) ? leaveMatrix[member][leaveType][arrayIdx] : '';
                    input.value = val;

                    input.addEventListener('input', () => {
                        let currentMatrix = {};
                        try {
                            currentMatrix = JSON.parse(localStorage.getItem(getLeaveDatesStorageKey())) || {};
                        } catch(e) { currentMatrix = {}; }

                        if (!currentMatrix[member]) currentMatrix[member] = { vl: Array(10).fill(''), sl: Array(5).fill('') };
                        if (!currentMatrix[member][leaveType]) currentMatrix[member][leaveType] = isVL ? Array(10).fill('') : Array(5).fill('');

                        currentMatrix[member][leaveType][arrayIdx] = input.value;
                        localStorage.setItem(getLeaveDatesStorageKey(), JSON.stringify(currentMatrix));

                        renderVLPieChart();
                    });

                    tdDate.appendChild(input);
                    tr.appendChild(tdDate);
                });

                leaveDatesBody.appendChild(tr);
            }
        }

        function renderVLPieChart() {
            let monthVLCounts = Array(12).fill(0);

            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key.startsWith("schedule_")) {
                    let parts = key.split('_');
                    let monthIdx = parseInt(parts[2]);

                    try {
                        let monthData = JSON.parse(localStorage.getItem(key)) || {};
                        Object.keys(monthData).forEach(day => {
                            let row = monthData[day];
                            team.forEach((member, memberIdx) => {
                                if (row[memberIdx] === 'VL') {
                                    monthVLCounts[monthIdx]++;
                                }
                            });
                        });
                    } catch(e){}
                }
            }

            const ctx = document.getElementById('vlPieChart').getContext('2d');
            const activeTheme = document.body.getAttribute('data-theme') || 'dark';
            const fontColor = activeTheme === 'light' ? '#333333' : '#ffffff';

            if (vlChartInstance) {
                vlChartInstance.destroy();
            }

            vlChartInstance = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: monthNames,
                    datasets: [{
                        label: 'Total Team VL Days',
                        data: monthVLCounts,
                        backgroundColor: [
                            '#f87171', '#fb923c', '#fbbf24', '#facc15',
                            '#a3e635', '#4ade80', '#34d399', '#2dd4bf',
                            '#38bdf8', '#60a5fa', '#818cf8', '#c084fc'
                        ],
                        borderWidth: 1,
                        borderColor: '#0b2240'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: fontColor,
                                font: { size: 10, weight: 'bold' },
                                boxWidth: 12
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || '';
                                    let value = context.parsed || 0;
                                    return `${label}: ${value} VL Day(s)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        monthSelect.addEventListener('change', renderCalendar);
        yearInput.addEventListener('input', renderCalendar);

        window.onload = function() {
            if (localStorage.getItem('rota_theme') === 'light') {
                document.body.setAttribute('data-theme', 'light');
            }
            renderCalendar();
            renderVLPieChart();
        };
    </script>
</body>
</html>
