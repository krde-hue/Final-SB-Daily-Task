<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Monthly Rota Schedule Manager</title>
    <style>
        body {
            background-color: #0b2240;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .btn-back {
            padding: 8px 14px;
            background-color: #38bdf8;
            color: #0b2240;
            font-weight: bold;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-back:hover { background-color: #7dd3fc; }
        .controls {
            margin-bottom: 20px;
            background: #133054;
            padding: 15px;
            border-radius: 6px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        label { font-weight: bold; font-size: 14px; }
        select, input {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #ffffff;
            background: #0b2240;
            color: white;
            font-weight: bold;
        }
        table {
            border-collapse: collapse;
            width: auto;
            min-width: 800px;
        }
        th, td {
            border: 1px solid #ffffff;
            padding: 5px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #0b2240;
            font-weight: bold;
        }
        .day-col, .date-col { width: 75px; }
        
        .shift-select {
            width: 100%;
            padding: 5px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            background-color: #ffffff;
            color: #000000;
        }
        .shift-select:focus { outline: 2px solid #00bcff; }

        /* Custom Color Logic rules for requested shifts */
        .shift-select[data-shift="7:00 - 10:00"] { background-color: #ffffff !important; color: #000000 !important; }
        .shift-select[data-shift="10:00 - 12:00"] { background-color: #fefce8 !important; color: #000000 !important; }
        .shift-select[data-shift="16:00 - 19:00"] { background-color: #ffedd5 !important; color: #000000 !important; }
        .shift-select[data-shift="22:00 - 1:00"] { background-color: #dbeafe !important; color: #000000 !important; }
        .shift-select[data-shift="RD"] { background-color: #a6a6a6 !important; color: #000000 !important; }
        .shift-select[data-shift="VL"] { background-color: #ffff00 !important; color: #000000 !important; }
    </style>
</head>
<body>

    <div class="header-top">
        <h2>Team Monthly Rota Schedule Manager</h2>
        <a href="index.html" class="btn-back">🔙 Back to Daily Duties</a>
    </div>
    
    <div class="controls">
        <div>
            <label for="month-select">Month: </label>
            <select id="month-select">
                <option value="0">January</option><option value="1">February</option>
                <option value="2">March</option><option value="3">April</option>
                <option value="4">May</option><option value="5">June</option>
                <option value="6" selected>July</option><option value="7">August</option>
                <option value="8">September</option><option value="9">October</option>
                <option value="10">November</option><option value="11">December</option>
            </select>
        </div>
        <div>
            <label for="year-input">Year: </label>
            <input type="number" id="year-input" value="2026" min="2020" max="2035" style="width: 80px;">
        </div>
        <div style="margin-left: auto; color: #cbd5e1; font-size: 13px;">
            💾 Shifts save automatically upon selection!
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th colspan="2">Date</th>
                <th style="color: #ffc0cb;">Ann</th>
                <th style="color: #9cc2e5;">Dave</th>
                <th style="color: #b4c6e7;">Kenneth</th>
                <th style="color: #c6e0b4;">Kriztel</th>
                <th style="color: #ffffff;">Miguel</th>
            </tr>
        </thead>
        <tbody id="schedule-body"></tbody>
    </table>

    <script>
        const team = ["Ann", "Dave", "Kenneth", "Kriztel", "Miguel"];
        const shifts = ["", "7:00 - 10:00", "10:00 - 12:00", "16:00 - 19:00", "22:00 - 1:00", "RD", "VL"];

        const monthSelect = document.getElementById('month-select');
        const yearInput = document.getElementById('year-input');
        const tbody = document.getElementById('schedule-body');
        const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thurs", "Fri", "Sat"];

        function getStorageKey() {
            return `schedule_${yearInput.value}_${monthSelect.value}`;
        }

        function updateCellColor(selectElement) {
            selectElement.setAttribute('data-shift', selectElement.value);
        }

        function renderCalendar() {
            tbody.innerHTML = '';
            const selectedMonth = parseInt(monthSelect.value);
            const selectedYear = parseInt(yearInput.value);

            const totalDays = new Date(selectedYear, selectedMonth + 1, 0).getDate();
            const monthLabel = monthSelect.options[selectedMonth].text.substring(0, 3);

            let savedMonthData = {};
            try {
                savedMonthData = JSON.parse(localStorage.getItem(getStorageKey())) || {};
            } catch(e) { savedMonthData = {}; }

            for (let d = 1; d <= totalDays; d++) {
                const dateObj = new Date(selectedYear, selectedMonth, d);
                const dayName = weekdays[dateObj.getDay()];

                const tr = document.createElement('tr');

                const tdDay = document.createElement('td');
                tdDay.className = 'day-col';
                tdDay.textContent = dayName;
                tr.appendChild(tdDay);

                const tdDate = document.createElement('td');
                tdDate.className = 'date-col';
                tdDate.textContent = `${d}-${monthLabel}`;
                tr.appendChild(tdDate);

                team.forEach((member, memberIdx) => {
                    const tdShift = document.createElement('td');
                    const select = document.createElement('select');
                    select.className = 'shift-select';
                    
                    shifts.forEach(shiftText => {
                        const opt = document.createElement('option');
                        opt.value = shiftText;
                        opt.textContent = shiftText === "" ? "-- Select --" : shiftText;
                        select.appendChild(opt);
                    });

                    let activeShift = "";
                    if (savedMonthData[d] && savedMonthData[d][memberIdx] !== undefined) {
                        activeShift = savedMonthData[d][memberIdx];
                    }

                    select.value = activeShift;
                    updateCellColor(select);

                    select.addEventListener('change', () => {
                        updateCellColor(select);
                        let currentMonthData = {};
                        try {
                            currentMonthData = JSON.parse(localStorage.getItem(getStorageKey())) || {};
                        } catch(e) { currentMonthData = {}; }

                        if (!currentMonthData[d]) currentMonthData[d] = Array(team.length).fill("");
                        currentMonthData[d][memberIdx] = select.value;

                        localStorage.setItem(getStorageKey(), JSON.stringify(currentMonthData));
                    });

                    tdShift.appendChild(select);
                    tr.appendChild(tdShift);
                });

                tbody.appendChild(tr);
            }
        }

        monthSelect.addEventListener('change', renderCalendar);
        yearInput.addEventListener('input', renderCalendar);
        renderCalendar();
    </script>
</body>
</html>
