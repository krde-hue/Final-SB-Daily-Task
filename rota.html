<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Monthly Rota Schedule Manager</title>
    <style>
        :root {
            --bg-color: #0b2240;
            --card-bg: #133054;
            --text-color: #ffffff;
            --header-text: #ffffff;
            --border-color: #ffffff;
            --table-header-bg: #0b2240;
            --accent-btn: #38bdf8;
            --accent-btn-text: #0b2240;
        }

        [data-theme="light"] {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --header-text: #0d233a;
            --border-color: #cbd5e0;
            --table-header-bg: #0d233a;
            --accent-btn: #0d233a;
            --accent-btn-text: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-back { background-color: var(--accent-btn); color: var(--accent-btn-text); }
        .btn-secondary { background-color: rgba(255, 255, 255, 0.2); color: var(--text-color); border: 1px solid var(--border-color); }

        .controls {
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 6px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        label { font-weight: bold; font-size: 14px; }
        select, input {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-weight: bold;
        }

        .main-layout {
            display: flex;
            gap: 25px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .table-container { overflow-x: auto; }

        table {
            border-collapse: collapse;
            width: auto;
            min-width: 750px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 5px;
            text-align: center;
            font-size: 13px;
        }

        th {
            background-color: var(--table-header-bg);
            color: #ffffff;
            font-weight: bold;
        }

        .day-col, .date-col { width: 75px; }

        .bulk-set-container {
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .bulk-select {
            font-size: 10px !important;
            padding: 2px !important;
            width: 100%;
        }

        .shift-select {
            width: 100%;
            padding: 5px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            background-color: #ffffff;
            color: #000000;
        }
        .shift-select:focus { outline: 2px solid #00bcff; }

        /* Color Coding for ROTA Shifts */
        .shift-select[data-shift="7:00 - 10:00"] { background-color: #86efac !important; color: #064e3b !important; } /* Light green */
        .shift-select[data-shift="10:00 - 12:00"] { background-color: #fed7aa !important; color: #7c2d12 !important; } /* Light orange */
        .shift-select[data-shift="16:00 - 19:00"] { background-color: #bae6fd !important; color: #0c4a6e !important; } /* Light blue */
        .shift-select[data-shift="22:00 - 1:00"] { background-color: #fca5a5 !important; color: #7f1d1d !important; } /* Light Red */
        .shift-select[data-shift="7:00 - 10:00 (WFH)"] { background-color: #fbcfe8 !important; color: #831843 !important; } /* PINK */
        .shift-select[data-shift="22:00 - 1:00 (WFH)"] { background-color: #f472b6 !important; color: #831843 !important; } /* Darker PINK */
        .shift-select[data-shift="RD"] { background-color: #9ca3af !important; color: #111827 !important; }
        .shift-select[data-shift="VL"] { background-color: #fde047 !important; color: #713f12 !important; }
        .shift-select[data-shift="SL"] { background-color: #c084fc !important; color: #3b0764 !important; }

        /* Leave Monitoring Dashboard Styling */
        .leave-dashboard {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 320px;
            flex: 1;
        }
        .leave-dashboard h3 {
            margin-top: 0;
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }
        .leave-table {
            width: 100%;
            min-width: 100%;
        }
        .leave-table input {
            width: 45px;
            text-align: center;
            padding: 2px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <h2>Team Monthly Rota Schedule Manager</h2>
        <div>
            <button class="btn btn-secondary" onclick="toggleDarkMode()">🌓 Mode</button>
            <a href="index.html" class="btn btn-back">🔙 Back to Daily Duties</a>
        </div>
    </div>
    
    <div class="controls">
        <div>
            <label for="month-select">Month: </label>
            <select id="month-select">
                <option value="0">January</option><option value="1">February</option>
                <option value="2">March</option><option value="3">April</option>
                <option value="4">May</option><option value="5">June</option>
                <option value="6" selected>July</option><option value="7">August</option>
                <option value="8">September</option><option value="9">October</option>
                <option value="10">November</option><option value="11">December</option>
            </select>
        </div>
        <div>
            <label for="year-input">Year: </label>
            <input type="number" id="year-input" value="2026" min="2020" max="2035" style="width: 80px;">
        </div>
        <div style="margin-left: auto; font-size: 12px; opacity: 0.9;">
            💾 Schedule & Leaves auto-save instantly!
        </div>
    </div>

    <div class="main-layout">
        <!-- Monthly Rota Schedule Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th colspan="2">Date</th>
                        <th style="color: #ffc0cb;">
                            Ann
                            <div class="bulk-set-container">
                                <select class="bulk-select" onchange="bulkSetShift(0, this.value)">
                                    <option value="">-- Set All Month --</option>
                                    <option value="7:00 - 10:00">7:00 - 10:00</option>
                                    <option value="10:00 - 12:00">10:00 - 12:00</option>
                                    <option value="16:00 - 19:00">16:00 - 19:00</option>
                                    <option value="22:00 - 1:00">22:00 - 1:00</option>
                                    <option value="7:00 - 10:00 (WFH)">7:00 - 10:00 (WFH)</option>
                                    <option value="22:00 - 1:00 (WFH)">22:00 - 1:00 (WFH)</option>
                                    <option value="RD">RD</option>
                                </select>
                            </div>
                        </th>
                        <th style="color: #9cc2e5;">
                            Dave
                            <div class="bulk-set-container">
                                <select class="bulk-select" onchange="bulkSetShift(1, this.value)">
                                    <option value="">-- Set All Month --</option>
                                    <option value="7:00 - 10:00">7:00 - 10:00</option>
                                    <option value="10:00 - 12:00">10:00 - 12:00</option>
                                    <option value="16:00 - 19:00">16:00 - 19:00</option>
                                    <option value="22:00 - 1:00">22:00 - 1:00</option>
                                    <option value="7:00 - 10:00 (WFH)">7:00 - 10:00 (WFH)</option>
                                    <option value="22:00 - 1:00 (WFH)">22:00 - 1:00 (WFH)</option>
                                    <option value="RD">RD</option>
                                </select>
                            </div>
                        </th>
                        <th style="color: #b4c6e7;">
                            Kenneth
                            <div class="bulk-set-container">
                                <select class="bulk-select" onchange="bulkSetShift(2, this.value)">
                                    <option value="">-- Set All Month --</option>
                                    <option value="7:00 - 10:00">7:00 - 10:00</option>
                                    <option value="10:00 - 12:00">10:00 - 12:00</option>
                                    <option value="16:00 - 19:00">16:00 - 19:00</option>
                                    <option value="22:00 - 1:00">22:00 - 1:00</option>
                                    <option value="7:00 - 10:00 (WFH)">7:00 - 10:00 (WFH)</option>
                                    <option value="22:00 - 1:00 (WFH)">22:00 - 1:00 (WFH)</option>
                                    <option value="RD">RD</option>
                                </select>
                            </div>
                        </th>
                        <th style="color: #c6e0b4;">
                            Kriztel
                            <div class="bulk-set-container">
                                <select class="bulk-select" onchange="bulkSetShift(3, this.value)">
                                    <option value="">-- Set All Month --</option>
                                    <option value="7:00 - 10:00">7:00 - 10:00</option>
                                    <option value="10:00 - 12:00">10:00 - 12:00</option>
                                    <option value="16:00 - 19:00">16:00 - 19:00</option>
                                    <option value="22:00 - 1:00">22:00 - 1:00</option>
                                    <option value="7:00 - 10:00 (WFH)">7:00 - 10:00 (WFH)</option>
                                    <option value="22:00 - 1:00 (WFH)">22:00 - 1:00 (WFH)</option>
                                    <option value="RD">RD</option>
                                </select>
                            </div>
                        </th>
                        <th style="color: #ffffff;">
                            Miguel
                            <div class="bulk-set-container">
                                <select class="bulk-select" onchange="bulkSetShift(4, this.value)">
                                    <option value="">-- Set All Month --</option>
                                    <option value="7:00 - 10:00">7:00 - 10:00</option>
                                    <option value="10:00 - 12:00">10:00 - 12:00</option>
                                    <option value="16:00 - 19:00">16:00 - 19:00</option>
                                    <option value="22:00 - 1:00">22:00 - 1:00</option>
                                    <option value="7:00 - 10:00 (WFH)">7:00 - 10:00 (WFH)</option>
                                    <option value="22:00 - 1:00 (WFH)">22:00 - 1:00 (WFH)</option>
                                    <option value="RD">RD</option>
                                </select>
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody id="schedule-body"></tbody>
            </table>
        </div>

        <!-- Leave Balance & Usage Monitoring Dashboard -->
        <div class="leave-dashboard">
            <h3>🌴 Vacation & Sick Leave Tracker</h3>
            <table class="leave-table">
                <thead>
                    <tr>
                        <th>Member</th>
                        <th>VL Used (Max 10)</th>
                        <th>SL Used (Max 5)</th>
                        <th>Total Taken</th>
                        <th>Usage %</th>
                    </tr>
                </thead>
                <tbody id="leave-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const team = ["Ann", "Dave", "Kenneth", "Kriztel", "Miguel"];
        const shifts = [
            "", 
            "7:00 - 10:00", 
            "10:00 - 12:00", 
            "16:00 - 19:00", 
            "22:00 - 1:00", 
            "7:00 - 10:00 (WFH)", 
            "22:00 - 1:00 (WFH)", 
            "RD", 
            "VL",
            "SL"
        ];

        const monthSelect = document.getElementById('month-select');
        const yearInput = document.getElementById('year-input');
        const tbody = document.getElementById('schedule-body');
        const leaveBody = document.getElementById('leave-body');
        const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thurs", "Fri", "Sat"];

        function getStorageKey() {
            return `schedule_${yearInput.value}_${monthSelect.value}`;
        }

        function getLeaveStorageKey() {
            return `leaves_tracker_db`;
        }

        function updateCellColor(selectElement) {
            selectElement.setAttribute('data-shift', selectElement.value);
        }

        function toggleDarkMode() {
            const currentTheme = document.body.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('rota_theme', newTheme);
        }

        function renderCalendar() {
            tbody.innerHTML = '';
            const selectedMonth = parseInt(monthSelect.value);
            const selectedYear = parseInt(yearInput.value);

            const totalDays = new Date(selectedYear, selectedMonth + 1, 0).getDate();
            const monthLabel = monthSelect.options[selectedMonth].text.substring(0, 3);

            let savedMonthData = {};
            try {
                savedMonthData = JSON.parse(localStorage.getItem(getStorageKey())) || {};
            } catch(e) { savedMonthData = {}; }

            for (let d = 1; d <= totalDays; d++) {
                const dateObj = new Date(selectedYear, selectedMonth, d);
                const dayName = weekdays[dateObj.getDay()];

                const tr = document.createElement('tr');

                const tdDay = document.createElement('td');
                tdDay.className = 'day-col';
                tdDay.textContent = dayName;
                tr.appendChild(tdDay);

                const tdDate = document.createElement('td');
                tdDate.className = 'date-col';
                tdDate.textContent = `${d}-${monthLabel}`;
                tr.appendChild(tdDate);

                team.forEach((member, memberIdx) => {
                    const tdShift = document.createElement('td');
                    const select = document.createElement('select');
                    select.className = 'shift-select';
                    
                    shifts.forEach(shiftText => {
                        const opt = document.createElement('option');
                        opt.value = shiftText;
                        opt.textContent = shiftText === "" ? "-- Select --" : shiftText;
                        select.appendChild(opt);
                    });

                    let activeShift = "";
                    if (savedMonthData[d] && savedMonthData[d][memberIdx] !== undefined) {
                        activeShift = savedMonthData[d][memberIdx];
                    }

                    select.value = activeShift;
                    updateCellColor(select);

                    select.addEventListener('change', () => {
                        updateCellColor(select);
                        let currentMonthData = {};
                        try {
                            currentMonthData = JSON.parse(localStorage.getItem(getStorageKey())) || {};
                        } catch(e) { currentMonthData = {}; }

                        if (!currentMonthData[d]) currentMonthData[d] = Array(team.length).fill("");
                        currentMonthData[d][memberIdx] = select.value;

                        localStorage.setItem(getStorageKey(), JSON.stringify(currentMonthData));
                    });

                    tdShift.appendChild(select);
                    tr.appendChild(tdShift);
                });

                tbody.appendChild(tr);
            }

            renderLeaveDashboard();
        }

        // Quick Bulk-Set Functionality for Whole Month
        function bulkSetShift(memberIdx, shiftValue) {
            if (!shiftValue) return;
            const selectedMonth = parseInt(monthSelect.value);
            const selectedYear = parseInt(yearInput.value);
            const totalDays = new Date(selectedYear, selectedMonth + 1, 0).getDate();

            let currentMonthData = {};
            try {
                currentMonthData = JSON.parse(localStorage.getItem(getStorageKey())) || {};
            } catch(e) { currentMonthData = {}; }

            for (let d = 1; d <= totalDays; d++) {
                if (!currentMonthData[d]) currentMonthData[d] = Array(team.length).fill("");
                currentMonthData[d][memberIdx] = shiftValue;
            }

            localStorage.setItem(getStorageKey(), JSON.stringify(currentMonthData));
            renderCalendar();
        }

        function renderLeaveDashboard() {
            leaveBody.innerHTML = '';
            let leaveData = {};
            try {
                leaveData = JSON.parse(localStorage.getItem(getLeaveStorageKey())) || {};
            } catch(e) { leaveData = {}; }

            team.forEach((member, memberIdx) => {
                let vlUsed = (leaveData[member] && leaveData[member].vl !== undefined) ? leaveData[member].vl : 0;
                let slUsed = (leaveData[member] && leaveData[member].sl !== undefined) ? leaveData[member].sl : 0;

                let totalTaken = parseInt(vlUsed) + parseInt(slUsed);
                let maxTotalLeaves = 15; // 10 VL + 5 SL
                let percentage = Math.round((totalTaken / maxTotalLeaves) * 100);

                let tr = document.createElement('tr');

                tr.innerHTML = `
                    <td style="font-weight: bold;">${member}</td>
                    <td><input type="number" min="0" max="10" value="${vlUsed}" onchange="updateLeaveCount('${member}', 'vl', this.value)"></td>
                    <td><input type="number" min="0" max="5" value="${slUsed}" onchange="updateLeaveCount('${member}', 'sl', this.value)"></td>
                    <td style="font-weight: bold;">${totalTaken} / 15</td>
                    <td style="font-weight: bold; color: ${percentage > 70 ? '#ef4444' : '#22c55e'};">${percentage}%</td>
                `;

                leaveBody.appendChild(tr);
            });
        }

        function updateLeaveCount(member, type, value) {
            let leaveData = {};
            try {
                leaveData = JSON.parse(localStorage.getItem(getLeaveStorageKey())) || {};
            } catch(e) { leaveData = {}; }

            if (!leaveData[member]) leaveData[member] = { vl: 0, sl: 0 };
            leaveData[member][type] = parseInt(value) || 0;

            localStorage.setItem(getLeaveStorageKey(), JSON.stringify(leaveData));
            renderLeaveDashboard();
        }

        monthSelect.addEventListener('change', renderCalendar);
        yearInput.addEventListener('input', renderCalendar);

        window.onload = function() {
            if (localStorage.getItem('rota_theme') === 'light') {
                document.body.setAttribute('data-theme', 'light');
            }
            renderCalendar();
        };
    </script>
</body>
</html>
