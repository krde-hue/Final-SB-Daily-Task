            align-items: center;

            background: var(--bg-surface);

            border-radius: 9999px;
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #22c55e;
        }

        .btn {
            background: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;

        .btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .btn-primary {
            background: var(--accent-color);
            color: #ffffff;
            border: none;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            color: #ffffff;
        }

        .btn-sm {
            padding: 0.25rem 0.6rem;
            font-size: 0.75rem;
        }

            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);

            border: none;
            color: var(--text-muted);

            font-size: 0.9rem;
            font-weight: 600;

        }

            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;

            padding: 0.5rem 0.8rem;
            border-radius: 0.375rem;

            color: var(--text-main);

            font-size: 0.875rem;

            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            background: var(--bg-surface);
            max-height: 75vh;

            text-align: left;
            font-size: 0.875rem;

            color: var(--text-main);

</head>

        // Calculate Totals for Player
        function calculatePlayerTotals(player) {
            let total = 0;
            let fourteenDay = 0;

            const now = new Date("2026-08-28");
            const fourteenDaysAgo = new Date(now);
            fourteenDaysAgo.setDate(now.getDate() - 14);

            if (player.records) {
                player.records.forEach(rec => {
                    const val = parseFloat(rec.amount) || 0;
                    total += val;
                    
                    const recDate = new Date(rec.date);
                    if (!isNaN(recDate) && recDate >= fourteenDaysAgo) {
                        fourteenDay += val;
                    }
                });
            }

            return { total, fourteenDay };
        }

                    <td contenteditable="true" onblur="updatePlayerField(${pIndex}, 'email', this.innerText)">${player.email}</td>
                    <td>
                        <div class="link-cell">
                            <input type="text" class="cell-input" value="${player.link || ''}" onchange="updatePlayerField(${pIndex}, 'link', this.value)">
                            ${player.link ? `<a href="${player.link}" target="_blank" class="link-btn"><i data-lucide="external-link" style="width: 14px; height: 14px;"></i></a>` : ''}
                        </div>
                    </td>
                    <td style="text-align: center;">
                        <span class="brand-badge brand-${brandNormalized}">${player.brand}</span>
                    </td>
                    <td contenteditable="true" onblur="updatePlayerField(${pIndex}, 'ccf', this.innerText)">${player.ccf || '1.00'}</td>
                    <td contenteditable="true" onblur="updatePlayerField(${pIndex}, 'notes', this.innerText)">${player.notes || ''}</td>
                    <td><div class="${totalClass}">${totalFormatted}</div></td>
                    <td><div class="${fourteenClass}">${fourteenFormatted}</div></td>
                    <td>
                        <select class="select-input" onchange="updatePlayerField(${pIndex}, 'status', this.value)">
                            <option value="Under Review" ${player.status === 'Under Review' ? 'selected' : ''}>Under Review</option>
                            <option value="Cleared" ${player.status === 'Cleared' ? 'selected' : ''}>Cleared</option>
                            <option value="Limited" ${player.status === 'Limited' ? 'selected' : ''}>Limited</option>
                        </select>
                    </td>
                `;

                // Sub-Table Details Row
                const detailsRow = document.createElement('tr');
                detailsRow.className = 'details-row';
                detailsRow.id = `details-row-${pIndex}`;

                let recordsHtml = '';
                if (player.records) {
                    player.records.forEach((rec, rIndex) => {
                        const amt = parseFloat(rec.amount) || 0;
                        const badgeClass = amt >= 0 ? 'badge-win' : 'badge-loss';
                        const badgeText = amt >= 0 ? 'Player Win' : 'Player Loss';

                        recordsHtml += `
                            <tr>
                                <td style="width: 150px;">
                                    <input type="date" class="cell-input" value="${rec.date}" onchange="updateRecord(${pIndex}, ${rIndex}, 'date', this.value)">
                                </td>
                                <td style="width: 160px;">
                                    <input type="number" step="0.01" class="cell-input" value="${rec.amount}" onchange="updateRecord(${pIndex}, ${rIndex}, 'amount', this.value)">
                                </td>
                                <td style="width: 110px; text-align: center;">
                                    <span class="badge ${badgeClass}">${badgeText}</span>
                                </td>
                                <td>
                                    <input type="text" class="cell-input" placeholder="Add note (e.g. Match/Market details)..." value="${rec.notes || ''}" onchange="updateRecord(${pIndex}, ${rIndex}, 'notes', this.value)">
                                </td>
                                <td style="width: 60px; text-align: center;">
                                    <button class="btn btn-sm btn-danger" onclick="deleteRecord(${pIndex}, ${rIndex})"><i data-lucide="trash-2" style="width: 14px; height: 14px;"></i></button>
                                </td>
                            </tr>
                        `;
                    });
                }

                detailsRow.innerHTML = `
                    <td colspan="9">
                        <div class="details-container">
                            <div class="subtable-card">
                                <div class="subtable-header">
                                    <h4><i data-lucide="history" style="width: 16px; height: 16px;"></i> Daily Win / Loss Monitoring Logs (${player.email})</h4>
                                    <button class="btn btn-sm btn-primary" onclick="addRecord(${pIndex})"><i data-lucide="plus" style="width: 14px; height: 14px;"></i> Add Daily Entry</button>
                                </div>
                                <table class="subtable">
                                    <thead>
                                        <tr>
                                            <th>Date</th>
                                            <th>Amount (EUR) [Positive = Win, Negative = Loss]</th>
                                            <th style="text-align: center;">Type</th>
                                            <th>Match / Bet Notes</th>
                                            <th style="text-align: center;">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${recordsHtml.length > 0 ? recordsHtml : '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 1rem;">No daily entries recorded yet. Click "Add Daily Entry" to input data.</td></tr>'}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </td>
                `;

                tbody.appendChild(row);
                tbody.appendChild(detailsRow);
            });

            lucide.createIcons();
        }

        // Toggle Expand / Collapse
        function toggleRow(index) {
            const masterRow = document.getElementById(`player-row-${index}`);
            const detailsRow = document.getElementById(`details-row-${index}`);

            const isOpen = detailsRow.classList.contains('open');
            
            if (isOpen) {
                detailsRow.classList.remove('open');
                masterRow.classList.remove('expanded');
            } else {
                detailsRow.classList.add('open');
                masterRow.classList.add('expanded');
            }
        }

        // Field Update Handlers
        function updatePlayerField(pIndex, field, value) {
            playersData[pIndex][field] = value;
            triggerSave();
            if (field === 'brand') renderTable();
        }

        function updateRecord(pIndex, rIndex, field, value) {
            playersData[pIndex].records[rIndex][field] = value;
            triggerSave();
            renderTable();
            document.getElementById(`details-row-${pIndex}`).classList.add('open');
            document.getElementById(`player-row-${pIndex}`).classList.add('expanded');
        }

        function addRecord(pIndex) {
            const today = new Date().toISOString().split('T')[0];
            if (!playersData[pIndex].records) playersData[pIndex].records = [];
            playersData[pIndex].records.push({
                date: today,
                amount: 0.00,
                notes: ""
            });
            triggerSave();
            renderTable();
            document.getElementById(`details-row-${pIndex}`).classList.add('open');
            document.getElementById(`player-row-${pIndex}`).classList.add('expanded');
        }

        function deleteRecord(pIndex, rIndex) {
            playersData[pIndex].records.splice(rIndex, 1);
            triggerSave();
            renderTable();
            document.getElementById(`details-row-${pIndex}`).classList.add('open');
            document.getElementById(`player-row-${pIndex}`).classList.add('expanded');
        }

        function addNewPlayer() {
            playersData.unshift({
                id: "NEW_" + Math.floor(100000 + Math.random() * 900000),
                email: "new.player@domain.com",
                link: "https://betbook.center/qbet/players/",
                brand: "qbet",
                ccf: "1.00",
                notes: "New account under monitoring",
                status: "Under Review",
                records: []
            });
            document.getElementById('user-count').textContent = playersData.length;
            triggerSave();
            renderTable();
            toggleRow(0);
        }

        // Search Filter Engine across all 747 Active Users[cite: 3]
        function filterPlayers() {
            const query = document.getElementById('search-input').value.toLowerCase();
            
            playersData.forEach((player, pIndex) => {
                const masterRow = document.getElementById(`player-row-${pIndex}`);
                const detailsRow = document.getElementById(`details-row-${pIndex}`);

                const match = player.id.toLowerCase().includes(query) || 
                              player.email.toLowerCase().includes(query) ||
                              (player.brand && player.brand.toLowerCase().includes(query)) ||
                              (player.notes && player.notes.toLowerCase().includes(query));

                if (match) {
                    masterRow.style.display = '';
                    if (detailsRow.classList.contains('open')) {
                        detailsRow.style.display = 'table-row';
                    }
                } else {
                    masterRow.style.display = 'none';
                    detailsRow.style.display = 'none';
                }
            });
        }

        // Dark / Light Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if (theme === 'dark') {
                themeIcon.setAttribute('data-lucide', 'moon');
                themeText.textContent = 'Dark Mode';
            } else {
                themeIcon.setAttribute('data-lucide', 'sun');
                themeText.textContent = 'Light Mode';
            }
            lucide.createIcons();
            localStorage.setItem('sportsbook_theme_747', theme);
        }

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        // Data Export
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(playersData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `Sportsbook_747_Daily_Winners_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        // Init on load
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('sportsbook_theme_747') || 'dark';
            setTheme(savedTheme);
            initData();
        });
    </script>
</body>
</html>
