<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toolbar Navigation</title>
  <style>
    /* Dark Theme Toolbar Container */
    body {
      background-color: #121824;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #1a202c;
      padding: 16px;
      border-radius: 8px;
    }

    /* Common Button Styling */
    .btn {
      background-color: #2d3748;
      color: #ffffff;
      border: 1px solid #3f4756;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: #3f4756;
    }

    /* Clear All Button Style */
    .btn-clear {
      background-color: #fff5f5;
      color: #e53e3e;
      border: 1px solid #fed7d7;
    }

    /* Dropdown Component Wrapper */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    /* SB HUB Custom Dropdown Button */
    .dropdown-btn {
      background-color: #2d3748;
      color: #ffffff;
      border: 1px solid #3f4756;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .arrow {
      font-size: 10px;
      margin-left: 4px;
    }

    /* Hidden Dropdown Menu Content */
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 6px;
      background-color: #2d3748;
      min-width: 160px;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.4);
      border-radius: 6px;
      border: 1px solid #3f4756;
      z-index: 1000;
      overflow: hidden;
    }

    .dropdown-menu a {
      color: #ffffff;
      padding: 10px 16px;
      text-decoration: none;
      display: block;
      font-size: 14px;
    }

    .dropdown-menu a:hover {
      background-color: #3f4756;
    }

    /* Show menu on button click */
    .dropdown.active .dropdown-menu {
      display: block;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button class="btn">👁️ 4</button>
    <button class="btn">🌓 Mode</button>

    <div class="dropdown" id="sbHubDropdown">
      <button class="dropdown-btn" onclick="toggleDropdown()">
        💼 SB HUB <span class="arrow">▼</span>
      </button>
      <div class="dropdown-menu">
        <a href="#workspace" onclick="selectOption('Workspace')">Workspace</a>
        <a href="#big-winners" onclick="selectOption('Big Winners')">Big Winners</a>
      </div>
    </div>

    <button class="btn">📅 ROTA</button>
    <button class="btn btn-clear">🗑️ Clear All</button>
    <button class="btn">➕ Add Next Day</button>
    <button class="btn">🖨️ Print / PDF</button>
  </div>

  <script>
    // Toggles the visibility of the dropdown options
    function toggleDropdown() {
      document.getElementById("sbHubDropdown").classList.toggle("active");
    }

    // Handles option selection and closes menu
    function selectOption(optionName) {
      console.log("Selected:", optionName);
      document.getElementById("sbHubDropdown").classList.remove("active");
    }

    // Close dropdown when clicking outside of it
    window.onclick = function(event) {
      if (!event.target.matches('.dropdown-btn') && !event.target.matches('.arrow')) {
        const dropdown = document.getElementById("sbHubDropdown");
        if (dropdown.classList.contains('active')) {
          dropdown.classList.remove('active');
        }
      }
    }
  </script>

</body>
</html>
